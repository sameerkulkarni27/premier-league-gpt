services:
  mongo:
    image: mongo:7
    container_name: pitchquery-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scraper-service:
    build:
      context: ./scraper-service
    container_name: pitchquery-scraper-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      mongo:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: pitchquery-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - scraper-service

  frontend:
    build:
      context: ./frontend
    container_name: pitchquery-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  mongo-data:
