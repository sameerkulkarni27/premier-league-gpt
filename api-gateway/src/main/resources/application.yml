server:
  port: 8080

spring:
  application:
    name: api-gateway

pitchquery:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  scraper:
    base-url: ${SCRAPER_SERVICE_BASE_URL:http://localhost:8001}
    max-age-seconds: ${SCRAPER_MAX_AGE_SECONDS:300}
  tool-loop:
    max-iterations: ${TOOL_LOOP_MAX_ITERATIONS:5}

management:
  endpoints:
    web:
      exposure:
        include: health
