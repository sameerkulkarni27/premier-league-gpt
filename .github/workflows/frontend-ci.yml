name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # frontend/ may not exist yet on this branch until the frontend task
      # merges. Skip gracefully instead of going red. See infra/README.md
      # for why this guard exists.
      - name: Check frontend/ is present
        id: gate
        shell: bash
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/ has no package.json yet — skipping (expected before that task merges)."
          fi

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Test
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npm test
        env:
          CI: true
