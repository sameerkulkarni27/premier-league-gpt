name: docker-build

# Verifies every service's Dockerfile actually builds. Runs on push to main
# only (i.e. after task PRs have merged) — no images are pushed anywhere,
# there are no registry credentials configured for this repo.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [scraper-service, api-gateway, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Check ${{ matrix.service }}/Dockerfile is present
        id: gate
        shell: bash
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.service }}/Dockerfile not found — skipping build."
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: pitch-query-${{ matrix.service }}:ci
